<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Polyglot Audio Drills</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --primary:#2c7be5;
  --bg:#f8f9fa;
  --text:#212529;
  --card:#fff;
  --radius:8px;
}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
  display:flex;
  flex-direction:column;
  min-height:100vh;
}
header{
  background:var(--primary);
  color:#fff;
  padding:1rem;
  text-align:center;
}
main{
  flex:1;
  padding:1rem;
  max-width:800px;
  margin:auto;
}
select, button{
  padding:.5rem 1rem;
  font-size:1rem;
  border-radius:var(--radius);
  border:1px solid #ccc;
}
button{
  background:var(--primary);
  color:#fff;
  border:none;
  cursor:pointer;
}
button:disabled{
  background:#aaa;
  cursor:not-allowed;
}
.card{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:0 2px 5px rgba(0,0,0,.1);
  padding:1rem;
  margin-bottom:1rem;
}
.card h3{
  margin:0 0 .5rem;
}
.drill-list{
  display:flex;
  flex-direction:column;
}
.score{
  font-size:2rem;
  font-weight:bold;
  margin:.5rem 0;
}
.heat{
  display:flex;
  flex-wrap:wrap;
}
.heat span{
  padding:.2rem .4rem;
  margin:.1rem;
  border-radius:4px;
  background:#e9ecef;
}
.heat .bad{background:#f8d7da;color:#721c24;}
.heat .good{background:#d4edda;color:#155724;}
footer{
  text-align:center;
  padding:1rem;
  font-size:.9rem;
  color:#666;
}
@media(max-width:600px){
  .heat span{font-size:.85rem;}
}
</style>
</head>
<body>
<header>
  <h1>Polyglot Audio Drills</h1>
  <p>1‑minute daily pronunciation drills with instant AI‑style feedback</p>
</header>
<main>
  <section id="setup">
    <label for="langSelect">Choose language:</label>
    <select id="langSelect">
      <option value="es">Spanish</option>
      <option value="fr">French</option>
      <option value="de">German</option>
      <option value="zh">Mandarin</option>
    </select>
  </section>

  <section id="drillSection" class="drill-list"></section>

  <section id="playSection" style="display:none;">
    <h2 id="phraseTitle"></h2>
    <button id="playNative">▶ Play native</button>
    <button id="recordBtn">● Record</button>
    <button id="stopBtn" disabled>■ Stop</button>
    <div id="result" style="margin-top:1rem;"></div>
    <button id="nextDrillBtn" style="margin-top:1rem;">Next Drill</button>
  </section>

  <section id="upgrade" style="margin-top:2rem; text-align:center;">
    <p>Enjoy unlimited drills and progress analytics with <strong>Polyglot Pro</strong> – only $4.99/mo</p>
    <button onclick="alert('Upgrade flow not implemented in this demo')">Upgrade Now</button>
  </section>
</main>
<footer>
  © 2026 Polyglot Audio Drills – All rights reserved.

const DRILLS = {

    {id:2, phrase:"Me gusta aprender idiomas."},
    {id:3, phrase:"¿Dónde está la estación de tren?"},
    {id:4, phrase:"Quiero una taza de café."},
    {id:5, phrase:"¿Puedes ayudarme, por favor?"}
  ],
  fr: [

  ],
  de: [

};

/* ---------- Storage & Limits ---------- */
const FREE_DAILY_LIMIT = 5;
function getTodayKey(){ return 'polyglot_'+new Date().toISOString().slice(0,10); }
function getDailyCount(){
  return parseInt(localStorage.getItem(getTodayKey()))||0;
}
function incDailyCount(){
  const key=getTodayKey();
  const cnt=getDailyCount()+1;
  localStorage.setItem(key,cnt);
}
function canUseFree(){ return getDailyCount()<FREE_DAILY_LIMIT; }

/* ---------- UI Rendering ---------- */
const langSelect=document.getElementById('langSelect');
const drillSection=document.getElementById('drillSection');
const playSection=document.getElementById('playSection');
const phraseTitle=document.getElementById('phraseTitle');
const resultDiv=document.getElementById('result');
const recordBtn=document.getElementById('recordBtn');
const stopBtn=document.getElementById('stopBtn');
const playNativeBtn=document.getElementById('playNative');
const nextDrillBtn=document.getElementById('nextDrillBtn');

let currentDrill=null;
let mediaRecorder=null;
let audioChunks=[];

/* ---------- Helpers ---------- */
function levenshtein(a,b){
  const m=a.length, n=b.length;
  const dp=Array.from({length:m+1},()=>Array(n+1).fill(0));
  for(let i=0;i<=m;i++)dp[i][0]=i;
  for(let j=0;j<=n;j++)dp[0][j]=j;
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      if(a[i-1]===b[j-1]) dp[i][j]=dp[i-1][j-1];
      else dp[i][j]=1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
    }
  }
  return dp[m][n];
}
function similarityScore(target, spoken){
  const t=target.toLowerCase().replace(/[^\w\s]/g,'').split(/\s+/);
  const s=spoken.toLowerCase().replace(/[^\w\s]/g,'').split(/\s+/);
  const dist=levenshtein(t,s);
  const maxLen=Math.max(t.length,s.length);
  return Math.round(((maxLen-dist)/maxLen)*100);
}
function highlight(target, spoken){
  const tWords=target.split(/\s+/);
  const sWords=spoken.split(/\s+/);
  const container=document.createElement('div');
  container.className='heat';
  tWords.forEach((w,i)=>{
    const span=document.createElement('span');
    span.textContent=w;
    if(sWords[i] && sWords[i].toLowerCase()===w.toLowerCase()){
      span.className='good';
    }else{
      span.className='bad';
    }
    container.appendChild(span);
  });
  return container;
}

/* ---------- Rendering Drills ---------- */
function renderDrillList(){
  drillSection.innerHTML='';
  const lang=langSelect.value;
  const list=DRILLS[lang];
  list.forEach(d=>{
    const card=document.createElement('div');
    card.className='card';
    const h3=document.createElement('h3');
    h3.textContent=d.phrase;
    const btn=document.createElement('button');
    btn.textContent='Start Drill';
    btn.onclick=()=>startDrill(d);
    card.appendChild(h3);
    card.appendChild(btn);
    drillSection.appendChild(card);
  });
}

/* ---------- Drill Flow ---------- */
function startDrill(drill){
  if(!canUseFree()){
    alert('Free daily limit reached. Please upgrade for unlimited access.');
    return;
  }
  currentDrill=drill;
  phraseTitle.textContent=drill.phrase;
  resultDiv.innerHTML='';
  playSection.style.display='block';
  drillSection.style.display='none';
  incDailyCount();
}
function resetAfterDrill(){
  playSection.style.display='none';
  drillSection.style.display='block';
  renderDrillList();
}

/* ---------- Native Playback (SpeechSynthesis) ---------- */
function playNative(){
  const utter=new SpeechSynthesisUtterance(currentDrill.phrase);
  const langMap={es:'es-ES',fr:'fr-FR',de:'de-DE',zh:'zh-CN'};
  utter.lang=langMap[langSelect.value]||'en-US';
  speechSynthesis.speak(utter);
}

/* ---------- Recording & Scoring ---------- */
function startRecording(){
  if(!navigator.mediaDevices || !window.MediaRecorder){
    alert('Your browser does not support audio recording.');
    return;
  }
  navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
    mediaRecorder=new MediaRecorder(stream);
    audioChunks=[];
    mediaRecorder.ondataavailable=e=>audioChunks.push(e.data);
    mediaRecorder.onstop=processAudio;
    mediaRecorder.start();
    recordBtn.disabled=true;
    stopBtn.disabled=false;
  }).catch(err=>alert('Microphone access denied.'));
}
function stopRecording(){
  if(mediaRecorder && mediaRecorder.state!=='inactive'){
    mediaRecorder.stop();
    recordBtn.disabled=false;
    stopBtn.disabled=true;
  }
}
function processAudio(){
  const blob=new Blob(audioChunks,{type:'audio/webm'});
  // Use Web Speech API for transcription (if available)
  const recognizer = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
  recognizer.lang = langSelect.value==='zh'?'zh-CN':'en-US';
  recognizer.interimResults = false;
  recognizer.maxAlternatives = 1;
  const audioURL = URL.createObjectURL(blob);
  const audio = new Audio(audioURL);
  // Play back silently to feed recognizer (not possible directly). 
  // As a fallback, ask user to type what they heard.
  if(!recognizer){
    fallbackManualInput();
    return;
  }
  // Unfortunately SpeechRecognition works on live mic, not on pre‑recorded audio.
  // We'll therefore fallback to manual input for this demo.
  fallbackManualInput();
}

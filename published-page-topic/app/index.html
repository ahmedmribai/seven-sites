<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEO Engage Optimizer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f9;
      color: #333;
    }
    .container {
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
      background: white;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      border-radius: 8px;
    }
    h1 {
      text-align: center;
      color: #4a90e2;
    }
    textarea {
      width: 100%;
      height: 200px;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 16px;
      margin-bottom: 20px;
    }
    button {
      display: block;
      width: 100%;
      padding: 10px;
      background-color: #4a90e2;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background-color: #357abd;
    }
    .result {
      margin-top: 20px;
      padding: 10px;
      background-color: #f9f9f9;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>SEO Engage Optimizer</h1>
    <textarea id="content" placeholder="Paste your content here..."></textarea>
    <button onclick="analyzeContent()">Analyze Content</button>
    <div id="result" class="result"></div>
  </div>
  <script>
    function analyzeContent() {
      const content = document.getElementById('content').value;
      const resultDiv = document.getElementById('result');
      resultDiv.innerHTML = '<p>Analyzing content...</p>';

      // Simulate AI analysis
      setTimeout(() => {
        const score = Math.floor(Math.random() * 100);
        const suggestions = [
          'Consider adding a more engaging headline.',
          'Include a clear call-to-action (CTA).',
          'Improve readability by breaking up long paragraphs.'
        ];
        resultDiv.innerHTML = `<p><strong>SEO Score:</strong> ${score}/100</p>`;
        resultDiv.innerHTML += '<p><strong>Suggestions:</strong></p>';
        suggestions.forEach(suggestion => {
          resultDiv.innerHTML += `<p>• ${suggestion}</p>`;
        });
      }, 1000);
    }
  </script>

</html>

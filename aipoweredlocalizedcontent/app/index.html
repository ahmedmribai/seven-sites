<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>AipoweredLocalizedContent</title><style>body{font-family: Arial, sans-serif;margin: 0;padding: 0;}header{background-color: #333;color: #fff;padding: 1em;text-align: center;}main{display: flex;flex-direction: column;align-items: center;padding: 2em;}section{background-color: #f7f7f7;padding: 1em;margin-bottom: 1em;border-radius: 10px;box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);}</style></head><body><header><h1>AipoweredLocalizedContent</h1></header><main><section><h2>Translate Your Content</h2><form id='translate-form'><label for='text-to-translate'>Enter text to translate:</label><textarea id='text-to-translate' rows='5' cols='30'></textarea><br><label for='language-to-translate'>Select language to translate to:</label><select id='language-to-translate'><option value='en'>English</option><option value='es'>Spanish</option><option value='fr'>French</option></select><br><button id='translate-button'>Translate</button></form><div id='translation-result'></div></section><section><h2>Usage Tracking</h2><p id='usage-tracking'></p></section></main><script src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.4.1/dist/supabase.min.js'></script><script>const supabaseUrl = 'https://your-supabase-url.supabase.co';const supabaseKey = 'your-supabase-key';const supabaseSecret = 'your-supabase-secret';const supabase = supabaseCreateClient(supabaseUrl, supabaseKey, supabaseSecret);document.getElementById('translate-button').addEventListener('click', async (e) => {e.preventDefault();const textToTranslate = document.getElementById('text-to-translate').value;const languageToTranslate = document.getElementById('language-to-translate').value;const response = await fetch(`https://api.example.com/translate?text=${textToTranslate}&lang=${languageToTranslate}`);const translationResult = await response.json();document.getElementById('translation-result').innerText = translationResult.translation;const usageTrackingResponse = await supabase.from('usage').select('translations_used');const usageTrackingResult = usageTrackingResponse.data;document.getElementById('usage-tracking').innerText = `You have used ${usageTrackingResult[0].translations_used} translations.`;});</script><script>(function(){try{var k='sv_uid',u=localStorage.getItem(k);if(!u){u=Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem(k,u);}new Image().src='https://beacon.ironforge.online/beacon/23?e=open&u='+encodeURIComponent(u);}catch(e){}})();</script></body></html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI-Powered Micro-Course Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f9;
      color: #333;
    }
    .container {
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
      background: white;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      border-radius: 8px;
    }
    h1 {
      text-align: center;
      color: #555;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    input, textarea, button {
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 16px;
    }
    button {
      background-color: #007bff;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    .course-output {
      margin-top: 20px;
      padding: 15px;
      background: #f9f9f9;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>AI-Powered Micro-Course Generator</h1>
    <form id="courseForm">
      <input type="text" id="topic" placeholder="Enter a niche professional skill" required>
      <textarea id="description" placeholder="Brief description of the skill" rows="4" required></textarea>
      <button type="submit">Generate Micro-Course</button>
    </form>
    <div class="course-output" id="courseOutput"></div>
  </div>
  <script>
    document.getElementById('courseForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const topic = document.getElementById('topic').value;
      const description = document.getElementById('description').value;
      const courseOutput = document.getElementById('courseOutput');
      courseOutput.innerHTML = 'Generating course...';
      // Simulate AI generation (replace with actual API call)
      setTimeout(() => {
        courseOutput.innerHTML = `<h3>Micro-Course on ${topic}</h3>
        <p>${description}</p>
        <ul>
          <li>Introduction to ${topic}</li>
          <li>Key Concepts</li>
          <li>Practical Applications</li>
          <li>Resources for Further Learning</li>
        </ul>`;
      }, 2000);
    });
  </script>

</html>
